# Rebuild every page, run every test, and check the committed builds are current.
# It is heavy (Chromium and every test), so it runs only when started by hand:
# the Actions tab's "Run workflow", or `gh workflow run test.yml --ref <branch>`.
name: test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 30, not 20: the Rex lab's page screenshots now take about 11 minutes on a slow runner (9 of the job's 15 on #34's run 38671324273)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.64.0
          playwright install --with-deps chromium

      - name: Rex lab - build
        working-directory: rex-strength-lab
        run: python build-data.py && node build.js
      - name: Build Calculator - build
        working-directory: build-calculator
        run: node build.js
      - name: Build Comparison - build
        working-directory: build-comparison
        run: python tools/compile_facts.py && node build.js
      - name: Committed builds match the sources
        run: |
          git diff --exit-code --stat -- rex-strength-lab/src/data.js '*/dist/index.html' build-comparison/data/facts.json \
            || { echo "::error::Generated files are out of date. Rebuild and commit them."; exit 1; }

      - name: Rex lab - calibration and physics checks
        working-directory: rex-strength-lab
        run: node test/calibration.js
      - name: Rex lab - restraint, presence, comic switches and growth checks
        working-directory: rex-strength-lab
        run: node test/presence.js
      - name: Rex lab - page screenshots
        working-directory: rex-strength-lab
        run: node test/shots.js
      - name: Rex lab - their four default powers (and every result with them off matching main's)
        working-directory: rex-strength-lab
        run: node test/powers.js
      - name: Rex lab - the energy ladder (rungs, sources and the comparison rule)
        working-directory: rex-strength-lab
        run: node test/ladder.js
      - name: Build Calculator - model tests
        working-directory: build-calculator
        run: node test/test.js
      - name: Build Calculator - page screenshots
        working-directory: build-calculator
        run: node test/shots.js
      - name: Build Comparison - model, figure and measuring-tool tests
        working-directory: build-comparison
        run: node test/test.js
      - name: Build Comparison - measuring tool on duo.jpg
        working-directory: build-comparison
        run: node test/duo.js
      - name: Build Comparison - page screenshots
        working-directory: build-comparison
        run: node test/shots.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '*/shots/'
          if-no-files-found: ignore
